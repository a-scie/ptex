[workspace]
members = [
    "package",
]

[package]
name = "ptex"
version = "1.7.1"
edition = "2024"
authors = [
    "John Sirois <john.sirois@gmail.com>",
]
publish = false

[profile.release]
opt-level = "s"
strip = "symbols"
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = "1.0"
google-cloud-auth = { version = "1.18", default-features = false, features = ["default-rustls-provider"] }
indicatif = "0.18"
percent-encoding = "2.3"
tokio = { version = "1", features = ["rt", "time", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[dependencies.curl]
version = "0.4"
default-features = false
features = [
    "http2",
    "ntlm",
    "protocol-ftp",
    "ssl",
    "static-curl",
    "static-ssl",
]

[dev-dependencies]
hex = "0.4"
sha2 = "0.11"
tempfile = "3.27"

[[test]]
name = "cli"
path = "tests/cli.rs"
